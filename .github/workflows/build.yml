name: build

on:
  push:
    branches: [stonecutter]
  pull_request:
    branches: [stonecutter]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.mc }}
        run: ./gradlew :${{ matrix.mc }}:build --no-daemon

      - name: Upload artifact ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: casinocraft-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error
